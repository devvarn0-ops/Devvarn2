<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PROFEX — Device Console</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
    :root{--bg:#0b0f1a;--card:#13182a;--card2:#1a2140;--accent:#00e5ff;--accent2:#00c853;--red:#ff1744;--orange:#ff9100;--text:#e8eaf6;--text2:#7c85a6;--radius:12px}
    body{background:var(--bg);color:var(--text);min-height:100vh;padding:16px 12px 80px}
    .container{max-width:820px;margin:0 auto}
    h1{font-size:22px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px;margin-bottom:20px}
    h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    h1 small{font-size:11px;font-weight:400;background:var(--card);color:var(--text2);padding:2px 10px;border-radius:20px;-webkit-text-fill-color:var(--text2)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
    .stat{background:var(--card);border-radius:var(--radius);padding:14px 10px;text-align:center;border:1px solid rgba(255,255,255,.04)}
    .stat .num{font-size:26px;font-weight:700;line-height:1.2}
    .stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-top:2px}
    .stat.total .num{color:var(--text)}
    .stat.online .num{color:var(--accent2)}
    .stat.offline .num{color:var(--red)}
    .stat.bank .num{color:var(--orange)}
    .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
    .toolbar input{flex:1;min-width:160px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none}
    .toolbar input:focus{border-color:var(--accent)}
    .toolbar select{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;outline:none;cursor:pointer}
    .device-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border:1px solid rgba(255,255,255,.04);display:flex;flex-direction:column;gap:8px;transition:.15s}
    .device-card:hover{border-color:rgba(0,229,255,.2)}
    .device-top{display:flex;justify-content:space-between;align-items:center}
    .device-name{font-weight:600;font-size:15px}
    .device-status{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}
    .device-status.online{background:rgba(0,200,83,.15);color:var(--accent2)}
    .device-status.offline{background:rgba(255,23,68,.15);color:var(--red)}
    .device-status.bank{background:rgba(255,145,0,.15);color:var(--orange)}
    .device-info{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px;color:var(--text2)}
    .device-info strong{color:var(--text);font-weight:500}
    .sms-feed{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-top:16px;border:1px solid rgba(255,255,255,.04)}
    .sms-feed h2{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .sms-feed h2 small{font-size:11px;color:var(--text2);font-weight:400}
    .sms-item{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;display:flex;gap:10px}
    .sms-item:last-child{border:0}
    .sms-time{color:var(--text2);white-space:nowrap;font-size:11px;min-width:60px;padding-top:1px}
    .sms-body{flex:1;word-break:break-word}
    .sms-body .badge{display:inline-block;font-size:10px;background:rgba(0,229,255,.12);color:var(--accent);padding:1px 7px;border-radius:10px;margin-right:5px}
    .add-acc{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;border:1px dashed rgba(255,255,255,.1)}
    .add-acc h3{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text2)}
    .add-acc-row{display:flex;gap:8px;flex-wrap:wrap}
    .add-acc-row input{flex:1;min-width:140px;background:var(--card2);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none}
    .add-acc-row input:focus{border-color:var(--accent)}
    .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;border-radius:8px;padding:9px 18px;color:#000;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
    .btn-sm{background:rgba(255,255,255,.06);border:0;border-radius:6px;padding:5px 12px;color:var(--text2);font-size:11px;cursor:pointer}
    .btn-sm:hover{background:rgba(255,255,255,.1)}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid rgba(0,229,255,.3);border-radius:10px;padding:10px 20px;font-size:13px;color:var(--accent);opacity:0;transition:.25s;pointer-events:none;z-index:99}
    .toast.show{opacity:1}
    @media(max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}.device-info{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="container">
  <h1><span>⚡ PROFEX</span> <small>v1.0</small></h1>

  <!-- Accounts -->
  <div class="add-acc" id="addAccSection">
    <h3>➕ Add Firebase Account</h3>
    <div class="add-acc-row">
      <input type="text" id="accName" placeholder="Label (e.g. Client A)" />
      <input type="url" id="accUrl" placeholder="Firebase DB URL" />
      <input type="text" id="accKey" placeholder="API / Secret key" />
      <button class="btn" onclick="addAccount()">Add</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats" id="statsRow">
    <div class="stat total"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
    <div class="stat online"><div class="num" id="statOnline">0</div><div class="lbl">Online</div></div>
    <div class="stat offline"><div class="num" id="statOffline">0</div><div class="lbl">Offline</div></div>
    <div class="stat bank"><div class="num" id="statBank">0</div><div class="lbl">Bank</div></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="🔍 Search device..." oninput="render()" />
    <select id="filterStatus" onchange="render()">
      <option value="all">All</option>
      <option value="online">Online</option>
      <option value="offline">Offline</option>
      <option value="bank">Bank</option>
    </select>
  </div>

  <!-- Device list -->
  <div id="deviceList"></div>

  <!-- SMS Feed -->
  <div class="sms-feed">
    <h2>📨 SMS Feed <small id="smsCount">0 messages</small></h2>
    <div id="smsList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── Mock Data ───────────────────────────────────────────────
const ACCOUNTS_KEY = 'profex_accounts';
const SMS_KEY = 'profex_sms';

function getAccounts() {
  const raw = localStorage.getItem(ACCOUNTS_KEY);
  return raw ? JSON.parse(raw) : [];
}
function setAccounts(a) { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); }

function getSms() {
  const raw = localStorage.getItem(SMS_KEY);
  return raw ? JSON.parse(raw) : [];
}
function setSms(s) { localStorage.setItem(SMS_KEY, JSON.stringify(s)); }

// Seed devices
function seedDevices() {
  const names = ['Nexus-7P','Galaxy-A55','iPhone-15','OnePlus-12','Pixel-8a','Xiaomi-14','Vivo-X100','Oppo-FindX','Realme-GT6','Nothing-2a',
                 'Motorola-Edge','Sony-Xperia','LG-Velvet','Asus-ZenFone','Huawei-P60','Honor-200','Tecno-Camon','Infinix-Zero','Micromax-IN','Nokia-G22'];
  const statuses = ['online','offline','bank'];
  const devices = names.map((n,i) => ({
    id: 'DEV-' + String(1001+i),
    name: n,
    status: statuses[i%3],
    phone: '+91-9' + String(8000000000 + i*1111111).slice(0,10),
    network: ['Jio','Airtel','VI','BSNL'][i%4],
    sim: ['SIM1','SIM2','eSIM'][i%3],
    lastSeen: new Date(Date.now() - i*3600000).toISOString(),
    fromSms: i < 5 ? ('OTP: ' + String(100000 + i*12345).slice(0,6) + ' valid 5min') : ''
  }));
  setAccounts([{name:'Default',url:'https://profex-default.firebaseio.com',key:'sk-xxxx',devices}]);
}

if (!localStorage.getItem(ACCOUNTS_KEY) || JSON.parse(localStorage.getItem(ACCOUNTS_KEY)).length===0) seedDevices();

// ─── SMS Simulation ──────────────────────────────────────────
function generateSms() {
  const otps = ['231456','889012','445678','112390','567234','901845','334567','778901','223456','667890'];
  const senders = ['BANK-SBI','PAYTM','GOOGLE','AMAZON','FLIPKART','PHONEPE','ICICI','HDFC','SWIGGY','ZOMATO'];
  const msg = senders[Math.floor(Math.random()*senders.length)] + ': OTP ' + otps[Math.floor(Math.random()*otps.length)] + ' is your verification code. Do not share.';
  return { time: new Date().toLocaleTimeString(), body: msg, from: 'DEV-' + String(1001+Math.floor(Math.random()*20)) };
}

function pushSms() {
  const sms = getSms();
  sms.unshift(generateSms());
  if (sms.length > 50) sms.length = 50;
  setSms(sms);
  renderSms();
}

function renderSms() {
  const list = document.getElementById('smsList');
  const sms = getSms();
  document.getElementById('smsCount').textContent = sms.length + ' messages';
  list.innerHTML = sms.map(s => `<div class="sms-item"><span class="sms-time">${s.time}</span><span class="sms-body"><span class="badge">${s.from}</span>${s.body}</span></div>`).join('');
}

// ─── Render Devices ──────────────────────────────────────────
function getAllDevices() {
  return getAccounts().flatMap(a => a.devices.map(d => ({...d, account: a.name})));
}

function render() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const f = document.getElementById('filterStatus').value;
  let devices = getAllDevices();
  if (q) devices = devices.filter(d => d.name.toLowerCase().includes(q) || d.id.toLowerCase().includes(q) || d.phone.includes(q));
  if (f !== 'all') devices = devices.filter(d => d.status === f);

  document.getElementById('statTotal').textContent = getAllDevices().length;
  document.getElementById('statOnline').textContent = getAllDevices().filter(d=>d.status==='online').length;
  document.getElementById('statOffline').textContent = getAllDevices().filter(d=>d.status==='offline').length;
  document.getElementById('statBank').textContent = getAllDevices().filter(d=>d.status==='bank').length;

  const list = document.getElementById('deviceList');
  if (!devices.length) { list.innerHTML = '<p style="color:var(--text2);font-size:14px;text-align:center;padding:30px 0">No devices match your search.</p>'; return; }
  list.innerHTML = devices.map(d => `
    <div class="device-card">
      <div class="device-top">
        <span class="device-name">${d.name} <span style="font-weight:400;font-size:12px;color:var(--text2)">${d.id}</span></span>
        <span class="device-status ${d.status}">${d.status.toUpperCase()}</span>
      </div>
      <div class="device-info">
        <span>📞 <strong>${d.phone}</strong></span>
        <span>📡 <strong>${d.network}</strong></span>
        <span>💳 <strong>${d.sim}</strong></span>
        <span>🕐 <strong>${new Date(d.lastSeen).toLocaleString()}</strong></span>
        ${d.fromSms ? '<span style="grid-column:1/-1">📩 <strong>FROM SMS:</strong> ' + d.fromSms + '</span>' : ''}
      </div>
    </div>
  `).join('');
}

// ─── Add Account ─────────────────────────────────────────────
function addAccount() {
  const name = document.getElementById('accName').value.trim();
  const url = document.getElementById('accUrl').value.trim();
  const key = document.getElementById('accKey').value.trim();
  if (!name || !url || !key) { toast('Fill all fields'); return; }
  const accs = getAccounts();
  accs.push({name,url,key,devices:[]});
  // clone some devices
  const template = getAllDevices().slice(0,3).map(d => ({...d, id: d.id + '-' + name.slice(0,3).toUpperCase(), account: name}));
  accs[accs.length-1].devices = template.length ? template : [{id:'DEV-9001-'+name.slice(0,3),name:name+'-Phone',status:'online',phone:'+91-9876543210',network:'Jio',sim:'SIM1',lastSeen:new Date().toISOString(),fromSms:''}];
  setAccounts(accs);
  document.getElementById('accName').value = '';
  document.getElementById('accUrl').value = '';
  document.getElementById('accKey').value = '';
  render();
  toast('Account "' + name + '" added');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = '✓ ' + msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ─── Init ────────────────────────────────────────────────────
render();
renderSms();
setInterval(pushSms, 7000);
setInterval(() => { render(); renderSms(); }, 15000);
</script>
</body>
</html>
