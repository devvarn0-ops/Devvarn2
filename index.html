<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Profex Panel</title>
    <script>
      (function () {
        var ua = navigator.userAgent || "";
        var isTg =
          /Telegram/i.test(ua) ||
          /TGWebApp/i.test(ua) ||
          typeof window.TelegramWebviewProxy !== "undefined" ||
          (window.Telegram && window.Telegram.WebApp);
        if (!isTg) return;

        var url = location.href;
        var hostPath = location.host + location.pathname + location.search + location.hash;
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var chromeIntent =
          "intent://" +
          hostPath +
          "#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=" +
          encodeURIComponent(url) +
          ";end";

        if (isAndroid) {
          location.replace(chromeIntent);
          setTimeout(function () {
            location.href = "googlechrome://navigate?url=" + encodeURIComponent(url);
          }, 500);
        } else if (isIOS) {
          location.href = "googlechrome://" + hostPath;
        }

        function showBanner() {
          if (document.getElementById("tg-chrome-banner")) return;
          var parent = document.body || document.documentElement;
          if (!parent) return;
          var b = document.createElement("div");
          b.id = "tg-chrome-banner";
          b.style.cssText =
            "position:fixed;inset:0;z-index:999999;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui,sans-serif";
          var html =
            '<div style="max-width:340px">' +
            '<p style="font-size:18px;font-weight:700;margin:0 0 12px">Open in Chrome</p>' +
            '<p style="font-size:14px;color:#aaa;margin:0 0 20px;line-height:1.5">This panel does not work inside Telegram. Open it in Chrome.</p>';
          if (isAndroid) {
            html +=
              '<a href="' +
              chromeIntent +
              '" style="display:inline-block;background:#ea4335;color:#fff;padding:14px 28px;border-radius:12px;font-weight:600;text-decoration:none;margin-bottom:12px">Open in Chrome</a><br/>';
          }
          html +=
            '<a href="' +
            url +
            '" target="_blank" rel="noopener" style="display:inline-block;background:#222;color:#fff;padding:12px 24px;border-radius:12px;font-weight:600;text-decoration:none;border:1px solid #333">Open in Browser</a>' +
            '<p style="font-size:12px;color:#666;margin-top:16px">Or tap ⋯ menu → Open in browser / Safari</p></div>';
          b.innerHTML = html;
          parent.appendChild(b);
        }
        if (document.body) showBanner();
        else document.addEventListener("DOMContentLoaded", showBanner);
        setTimeout(showBanner, 200);
        setTimeout(showBanner, 1000);
      })();
    </script>
