<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Profex - Device Management Console</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Helvetica Neue',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0a0e17;color:#e0e6f0;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#0a0e17}
::-webkit-scrollbar-thumb{background:#2a3a5c;border-radius:4px}
.container{max-width:480px;margin:0 auto;padding:0 16px 80px}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;border-bottom:1px solid rgba(255,255,255,.06)}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#6c5ce7,#a29bfe);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:700}
.logo-text{font-size:18px;font-weight:700;letter-spacing:-.3px}
.logo-text span{color:#6c5ce7}
.header-actions{display:flex;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:none;background:rgba(255,255,255,.05);color:#8899b4;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.icon-btn:hover{background:rgba(255,255,255,.1);color:#e0e6f0}
.balance-card{background:linear-gradient(135deg,#1a1f2e,#0f1420);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:24px;margin:20px 0;position:relative;overflow:hidden}
.balance-card::before{content:'';position:absolute;top:-50%;right:-30%;width:200px;height:200px;background:radial-gradient(circle,rgba(108,92,231,.15),transparent 70%);border-radius:50%}
.balance-label{font-size:13px;color:#6b7a99;margin-bottom:4px}
.balance-amount{font-size:36px;font-weight:800;letter-spacing:-1px;color:#fff}
.balance-amount span{font-size:18px;color:#6b7a99;font-weight:500}
.balance-change{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;margin-top:6px;padding:4px 10px;border-radius:20px}
.balance-change.up{color:#00d283;background:rgba(0,210,131,.12)}
.balance-change.down{color:#ff4757;background:rgba(255,71,87,.12)}
.balance-actions{display:flex;gap:10px;margin-top:18px}
.bal-btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
.bal-btn.primary{background:linear-gradient(135deg,#6c5ce7,#5f3dc4);color:#fff}
.bal-btn.primary:hover{opacity:.9}
.bal-btn.secondary{background:rgba(255,255,255,.06);color:#e0e6f0;border:1px solid rgba(255,255,255,.08)}
.bal-btn.secondary:hover{background:rgba(255,255,255,.1)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat-card{background:#111827;border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:16px}
.stat-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;margin-bottom:10px}
.stat-icon.purple{background:rgba(108,92,231,.15);color:#a29bfe}
.stat-icon.green{background:rgba(0,210,131,.12);color:#00d283}
.stat-icon.blue{background:rgba(54,153,255,.12);color:#3699ff}
.stat-icon.orange{background:rgba(255,159,67,.12);color:#ff9f43}
.stat-value{font-size:20px;font-weight:700;color:#fff}
.stat-label{font-size:12px;color:#6b7a99;margin-top:2px}
.section-title{display:flex;align-items:center;justify-content:space-between;padding:12px 0 8px}
.section-title h3{font-size:16px;font-weight:600;color:#e0e6f0}
.section-title a{font-size:13px;color:#6c5ce7;text-decoration:none;font-weight:500}
.device-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.device-item{background:#111827;border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.2s}
.device-item:active{transform:scale(.98)}
.device-avatar{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0}
.device-avatar.purple{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}
.device-avatar.green{background:linear-gradient(135deg,#00b894,#55efc4)}
.device-avatar.blue{background:linear-gradient(135deg,#3699ff,#74b9ff)}
.device-avatar.orange{background:linear-gradient(135deg,#f39c12,#fdcb6e)}
.device-avatar.red{background:linear-gradient(135deg,#e17055,#fab1a0)}
.device-info{flex:1;min-width:0}
.device-name{font-size:14px;font-weight:600;color:#e0e6f0}
.device-meta{font-size:12px;color:#6b7a99;margin-top:2px;display:flex;align-items:center;gap:6px}
.device-status{width:6px;height:6px;border-radius:50%;display:inline-block}
.device-status.online{background:#00d283}
.device-status.offline{background:#6b7a99}
.device-status.warning{background:#ff9f43}
.device-arrow{color:#3d4a66;font-size:12px}
.tx-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.tx-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.tx-item:last-child{border-bottom:none}
.tx-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.tx-icon.in{background:rgba(0,210,131,.12);color:#00d283}
.tx-icon.out{background:rgba(255,71,87,.12);color:#ff4757}
.tx-info{flex:1;min-width:0}
.tx-title{font-size:14px;font-weight:500;color:#e0e6f0}
.tx-date{font-size:12px;color:#6b7a99;margin-top:1px}
.tx-amount{font-size:14px;font-weight:600;text-align:right}
.tx-amount.in{color:#00d283}
.tx-amount.out{color:#ff4757}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:rgba(10,14,23,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.06);display:flex;padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;color:#3d4a66;transition:.2s;border:none;background:none;font-size:10px}
.nav-item.active{color:#6c5ce7}
.nav-item i{font-size:20px}
.nav-item span{font-size:10px;font-weight:500}
.nav-item.active i,.nav-item.active span{color:#6c5ce7}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;justify-content:center;align-items:flex-end;padding-bottom:40px}
.modal-overlay.show{display:flex}
.modal-content{background:#1a1f2e;border-radius:20px;padding:24px;max-width:440px;width:90%;max-height:80vh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:40px;height:4px;background:#3d4a66;border-radius:4px;margin:0 auto 16px}
.modal-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:16px;text-align:center}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:12px;color:#6b7a99;margin-bottom:4px;font-weight:500}
.modal-field input,.modal-field select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#111827;color:#e0e6f0;font-size:14px;outline:none;transition:.2s}
.modal-field input:focus,.modal-field select:focus{border-color:#6c5ce7}
.modal-btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:.2s}
.modal-btn.primary{background:linear-gradient(135deg,#6c5ce7,#5f3dc4);color:#fff}
.modal-btn.primary:hover{opacity:.9}
.modal-btn.secondary{background:rgba(255,255,255,.06);color:#e0e6f0}
.modal-btn.secondary:hover{background:rgba(255,255,255,.1)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1f2e;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 20px;font-size:14px;color:#e0e6f0;z-index:200;display:none;animation:fadeIn .3s ease;max-width:90%}
.toast.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.empty-state{text-align:center;padding:40px 20px;color:#6b7a99}
.empty-state i{font-size:48px;margin-bottom:12px;color:#3d4a66}
.empty-state p{font-size:14px}
.conn-status{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 12px;border-radius:20px;margin:0 0 12px}
.conn-status.connected{background:rgba(0,210,131,.12);color:#00d283}
.conn-status.connecting{background:rgba(255,159,67,.12);color:#ff9f43}
.conn-status.error{background:rgba(255,71,87,.12);color:#ff4757}
</style>
</head>
<body>
<div class="container" id="app">
<div class="header">
<div class="logo"><div class="logo-icon">P</div><div class="logo-text">Prof<span>ex</span></div></div>
<div class="header-actions"><button class="icon-btn" onclick="showToast('No new notifications')"><i class="fas fa-bell"></i></button><button class="icon-btn" onclick="showToast('Settings')"><i class="fas fa-cog"></i></button></div>
</div>
<div id="connStatus" class="conn-status connecting"><i class="fas fa-circle"></i> <span id="connText">Connecting to Firebase...</span></div>
<div class="balance-card">
<div class="balance-label">Total Balance</div>
<div class="balance-amount" id="balanceDisplay">$0.00 <span>USD</span></div>
<div class="balance-change up" id="balanceChange"><i class="fas fa-arrow-up"></i> <span>+0.00%</span></div>
<div class="balance-actions"><button class="bal-btn primary" onclick="openModal('deposit')"><i class="fas fa-plus"></i> Deposit</button><button class="bal-btn secondary" onclick="openModal('withdraw')"><i class="fas fa-arrow-up-from-bracket"></i> Withdraw</button></div>
</div>
<div class="stats-grid">
<div class="stat-card"><div class="stat-icon purple"><i class="fas fa-layer-group"></i></div><div class="stat-value" id="totalDevices">0</div><div class="stat-label">Total Devices</div></div>
<div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div class="stat-value" id="activeDevices">0</div><div class="stat-label">Active</div></div>
<div class="stat-card"><div class="stat-icon blue"><i class="fas fa-arrow-right-arrow-left"></i></div><div class="stat-value" id="totalTx">0</div><div class="stat-label">Transactions</div></div>
<div class="stat-card"><div class="stat-icon orange"><i class="fas fa-clock"></i></div><div class="stat-value" id="pendingTx">0</div><div class="stat-label">Pending</div></div>
</div>
<div class="section-title"><h3><i class="fas fa-server" style="color:#6c5ce7;margin-right:6px"></i> Your Devices</h3><a href="#" onclick="openModal('addDevice')">+ Add</a></div>
<div class="device-list" id="deviceList"><div class="empty-state" id="deviceEmpty"><i class="fas fa-server"></i><p>No devices yet. Tap "+ Add" to get started.</p></div></div>
<div class="section-title"><h3><i class="fas fa-receipt" style="color:#6c5ce7;margin-right:6px"></i> Recent Transactions</h3><a href="#" onclick="showToast('All transactions')">View All</a></div>
<div class="tx-list" id="txList"><div class="empty-state" id="txEmpty"><i class="fas fa-receipt"></i><p>No transactions yet.</p></div></div>
</div>
<div class="bottom-nav">
<button class="nav-item active"><i class="fas fa-home"></i><span>Home</span></button>
<button class="nav-item" onclick="showToast('Devices page')"><i class="fas fa-server"></i><span>Devices</span></button>
<button class="nav-item" onclick="showToast('Analytics page')"><i class="fas fa-chart-bar"></i><span>Analytics</span></button>
<button class="nav-item" onclick="showToast('Profile page')"><i class="fas fa-user"></i><span>Profile</span></button>
</div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
<div class="modal-content" onclick="event.stopPropagation()">
<div class="modal-handle"></div>
<div class="modal-title" id="modalTitle">Action</div>
<div id="modalBody"></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
projectId: "YOUR_PROJECT",
storageBucket: "YOUR_PROJECT.appspot.com",
messagingSenderId: "YOUR_SENDER_ID",
appId: "YOUR_APP_ID"
};
let state = {balance:0,balanceChange:0,devices:[],transactions:[]};
let dbRef = null;
let firebaseConnected = false;
function setConnStatus(status,msg){document.getElementById('connStatus').className='conn-status '+status;document.getElementById('connText').textContent=msg;}
function initFirebase(){
try{
if(typeof firebase==='undefined'){setConnStatus('error','Firebase SDK not loaded');loadDemoData();return;}
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const db=firebase.database();
dbRef=db.ref('/');
setConnStatus('connecting','Connecting to Firebase...');
const timeout=setTimeout(()=>{if(!firebaseConnected){setConnStatus('error','Connection timeout. Using demo data.');loadDemoData();}},8000);
dbRef.on('value',(snapshot)=>{
clearTimeout(timeout);
const data=snapshot.val();
if(data){firebaseConnected=true;setConnStatus('connected','Live - Firebase connected');state.balance=data.balance||0;state.balanceChange=data.balanceChange||0;state.devices=data.devices?Object.values(data.devices):[];state.transactions=data.transactions?Object.values(data.transactions):[];renderAll();
}else{firebaseConnected=true;setConnStatus('connected','Live - Firebase connected (empty DB)');loadDemoData();syncToFirebase();}
},(error)=>{clearTimeout(timeout);console.error('Firebase error:',error);setConnStatus('error','Firebase error: '+error.message);loadDemoData();});
}catch(e){console.error('Firebase init error:',e);setConnStatus('error','Firebase init failed');loadDemoData();}
}
function syncToFirebase(){if(!firebaseConnected||!dbRef)return;const data={balance:state.balance,balanceChange:state.balanceChange,devices:state.devices.reduce((a,d)=>{a[d.id]=d;return a;},{}),transactions:state.transactions.reduce((a,t)=>{a[t.id]=t;return a;},{})};dbRef.set(data).catch(e=>console.warn('Firebase write error:',e));}
function loadDemoData(){state={balance:2847.50,balanceChange:12.4,devices:[{id:'d1',name:'Alpha Node',type:'Mining Rig',status:'online',avatar:'purple',hash:'0x7a3f...b912'},{id:'d2',name:'Beta Server',type:'Validator',status:'online',avatar:'green',hash:'0x4e21...c837'},{id:'d3',name:'Gamma Relay',type:'Router',status:'warning',avatar:'orange',hash:'0x9d84...f201'},{id:'d4',name:'Delta Cache',type:'Storage',status:'offline',avatar:'red',hash:'0x2b67...e445'},{id:'d5',name:'Epsilon Core',type:'Compute',status:'online',avatar:'blue',hash:'0xfc12...a789'}],transactions:[{id:'t1',title:'Deposit from Wallet',date:'Today, 2:30 PM',amount:500,type:'in'},{id:'t2',title:'Withdrawal to Exchange',date:'Today, 11:15 AM',amount:200,type:'out'},{id:'t3',title:'Mining Reward',date:'Yesterday, 8:00 PM',amount:0.035,type:'in'},{id:'t4',title:'Device Fee',date:'Yesterday, 6:00 AM',amount:12.50,type:'out'},{id:'t5',title:'Referral Bonus',date:'2 days ago',amount:25,type:'in'}]};renderAll();}
function renderAll(){renderBalance();renderStats();renderDevices();renderTransactions();}
function renderBalance(){document.getElementById('balanceDisplay').textContent='$'+state.balance.toFixed(2)+' ';const e=document.getElementById('balanceChange');const u=state.balanceChange>=0;e.className='balance-change '+(u?'up':'down');e.innerHTML='<i class="fas fa-arrow-'+(u?'up':'down')+'"></i> <span>'+(u?'+':'')+state.balanceChange.toFixed(2)+'%</span>';}
function renderStats(){const a=state.devices.filter(d=>d.status==='online').length;document.getElementById('totalDevices').textContent=state.devices.length;document.getElementById('activeDevices').textContent=a;document.getElementById('totalTx').textContent=state.transactions.length;document.getElementById('pendingTx').textContent=state.transactions.filter(t=>t.type==='out').length;}
function renderDevices(){const l=document.getElementById('deviceList');if(!state.devices.length){l.innerHTML='<div class="empty-state"><i class="fas fa-server"></i><p>No devices yet. Tap "+ Add" to get started.</p></div>';return;}l.innerHTML=state.devices.map(d=>{const s={online:'online',offline:'offline',warning:'warning'}[d.status]||'offline';return'<div class="device-item" onclick="showDeviceDetail(''+d.id+'')"><div class="device-avatar '+d.avatar+'">'+d.name.charAt(0)+'</div><div class="device-info"><div class="device-name">'+d.name+'</div><div class="device-meta"><span class="device-status '+s+'"></span> '+d.type+' &middot; '+d.hash+'</div></div><div class="device-arrow"><i class="fas fa-chevron-right"></i></div></div>';}).join('');}
function renderTransactions(){const l=document.getElementById('txList');if(!state.transactions.length){l.innerHTML='<div class="empty-state"><i class="fas fa-receipt"></i><p>No transactions yet.</p></div>';return;}l.innerHTML=state.transactions.map(t=>{const s=t.type==='in'?'+':'-';return'<div class="tx-item"><div class="tx-icon '+t.type+'"><i class="fas fa-'+(t.type==='in'?'arrow-down':'arrow-up')+'"></i></div><div class="tx-info"><div class="tx-title">'+t.title+'</div><div class="tx-date">'+t.date+'</div></div><div class="tx-amount '+t.type+'">'+s+'$'+Math.abs(t.amount).toFixed(2)+'</div></div>';}).join('');}
function openModal(a){const o=document.getElementById('modalOverlay');const t=document.getElementById('modalTitle');const b=document.getElementById('modalBody');o.classList.add('show');
if(a==='deposit'){t.textContent='Deposit Funds';b.innerHTML='<div class="modal-field"><label>Amount (USD)</label><input type="number" id="depositAmount" placeholder="0.00" step="0.01" min="1"></div><div class="modal-field"><label>Payment Method</label><select id="depositMethod"><option>Credit Card</option><option>Bank Transfer</option><option>Crypto</option></select></div><button class="modal-btn primary" onclick="submitDeposit()"><i class="fas fa-check"></i> Confirm Deposit</button>';}
else if(a==='withdraw'){t.textContent='Withdraw Funds';b.innerHTML='<div class="modal-field"><label>Amount (USD)</label><input type="number" id="withdrawAmount" placeholder="0.00" step="0.01" min="1"></div><div class="modal-field"><label>Wallet Address</label><input type="text" id="withdrawAddress" placeholder="Enter wallet address"></div><button class="modal-btn primary" onclick="submitWithdraw()"><i class="fas fa-check"></i> Confirm Withdrawal</button>';}
else if(a==='addDevice'){t.textContent='Add New Device';b.innerHTML='<div class="modal-field"><label>Device Name</label><input type="text" id="deviceName" placeholder="My Device"></div><div class="modal-field"><label>Device Type</label><select id="deviceType"><option>Mining Rig</option><option>Validator</option><option>Router</option><option>Storage</option><option>Compute</option></select></div><button class="modal-btn primary" onclick="submitDevice()"><i class="fas fa-plus"></i> Add Device</button>';}}
function closeModal(e){if(e&&e.target!==document.getElementById('modalOverlay'))return;document.getElementById('modalOverlay').classList.remove('show');}
function submitDeposit(){const a=parseFloat(document.getElementById('depositAmount').value)||0;if(a<=0){showToast('Enter a valid amount');return;}showToast('Deposit of $'+a.toFixed(2)+' initiated!');state.balance+=a;state.transactions.unshift({id:'t'+Date.now(),title:'Deposit',date:'Just now',amount:a,type:'in'});renderAll();if(firebaseConnected)syncToFirebase();document.getElementById('modalOverlay').classList.remove('show');}
function submitWithdraw(){const a=parseFloat(document.getElementById('withdrawAmount').value)||0;const ad=document.getElementById('withdrawAddress').value.trim();if(a<=0||a>state.balance){showToast('Invalid amount');return;}if(!ad){showToast('Enter wallet address');return;}showToast('Withdrawal of $'+a.toFixed(2)+' processing...');state.balance-=a;state.transactions.unshift({id:'t'+Date.now(),title:'Withdrawal to '+ad.slice(0,6)+'...',date:'Just now',amount:a,type:'out'});renderAll();if(firebaseConnected)syncToFirebase();document.getElementById('modalOverlay').classList.remove('show');}
function submitDevice(){const n=document.getElementById('deviceName').value.trim();const t=document.getElementById('deviceType').value;if(!n){showToast('Enter device name');return;}const av=['purple','green','blue','orange','red'];const d={id:'d'+Date.now(),name:n,type:t,status:'online',avatar:av[state.devices.length%av.length],hash:'0x'+Math.random().toString(16).slice(2,10)+'...'+Math.random().toString(16).slice(2,6)};state.devices.push(d);showToast('Device "'+n+'" added!');renderAll();if(firebaseConnected)syncToFirebase();document.getElementById('modalOverlay').classList.remove('show');}
function showDeviceDetail(id){const d=state.devices.find(d=>d.id===id);if(!d)return;const o=document.getElementById('modalOverlay');document.getElementById('modalTitle').textContent=d.name;document.getElementById('modalBody').innerHTML='<div style="text-align:center;margin-bottom:16px"><div class="device-avatar '+d.avatar+'" style="width:60px;height:60px;font-size:24px;margin:0 auto 12px;border-radius:16px">'+d.name.charAt(0)+'</div><div style="font-size:16px;font-weight:600;color:#fff">'+d.name+'</div><div style="font-size:13px;color:#6b7a99;margin-top:2px">'+d.type+'</div></div><div class="modal-field"><label>Status</label><div style="padding:12px 14px;border-radius:10px;background:#111827;color:#e0e6f0;font-size:14px"><span class="device-status '+d.status+'" style="margin-right:6px"></span> '+d.status.charAt(0).toUpperCase()+d.status.slice(1)+'</div></div><div class="modal-field"><label>Hash</label><div style="padding:12px 14px;border-radius:10px;background:#111827;color:#6b7a99;font-size:13px;font-family:monospace">'+d.hash+'</div></div><button class="modal-btn secondary" onclick="document.getElementById('modalOverlay').classList.remove('show')">Close</button>';o.classList.add('show');}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}
document.addEventListener('DOMContentLoaded',()=>{setTimeout(initFirebase,500);});
</script>
</body>
</html>
