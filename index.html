<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>Profex Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ef4444'><path d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z'/></svg>">
    <style>
        *,:after,:before{box-sizing:border-box;border:0 solid;margin:0;padding:0}
        html{font-family:Inter,system-ui,sans-serif;background:#080808;color:#e0e0e0;-webkit-font-smoothing:antialiased}
        body{min-height:100vh;background:#080808}
        #root{min-height:100vh}
        :root{--background:0 0% 4%;--foreground:0 0% 92%;--border:0 0% 12%;--card:0 0% 7%;--muted:0 0% 10%;--muted-foreground:0 0% 45%;--accent:0 0% 12%;--primary:0 84% 50%;--radius:.75rem}
        .red-gradient{background:linear-gradient(135deg,#dc2626,#c2410c)}
        .glass-card{-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);background:#111111e6;border:1px solid #ffffff0f}
        @keyframes fadeIn{0%{opacity:0;transform:translateY(10px) scale(0.98);filter:blur(2px)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
        .animate-fade-in{animation:fadeIn 1s ease-out forwards}
        @keyframes glint{0%,100%{transform:scale(1);opacity:0}50%{transform:scale(1.5);opacity:1}}
        .animate-glint{animation:glint 1.5s infinite;box-shadow:0 0 6px #6acfff,0 0 10px #0088cc}
    </style>
    <link rel="stylesheet" href="/assets/BEVrsPeR.css">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/assets/C4ezbrm4.js"></script>
</body>
</html>
